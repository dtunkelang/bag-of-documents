# Pre-commit hooks for bagofdocs.
#
# Setup (one-time, per clone):
#   pip install pre-commit
#   pre-commit install   # fast checks on every commit
#
# Commits run cheap local checks (ruff + shell-script paths, ~1s).
# Full import smoke + pytest run in GitHub CI on push, not locally —
# local pre-push was ~90s per push and CI catches the same failures.

default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix]
        files: '\.py$'
      - id: ruff-format
        name: ruff format
        files: '\.py$'

  - repo: local
    hooks:
      # Trip on shell-script paths that point at moved or missing scripts.
      # Fast (no Python imports), so it stays on pre-commit.
      - id: shell-script-paths
        name: shell-script paths point at real files
        entry: .venv/bin/python -m pytest tests/test_script_paths.py -q
        language: system
        pass_filenames: false
        files: '\.(sh|py)$'
        stages: [pre-commit]
